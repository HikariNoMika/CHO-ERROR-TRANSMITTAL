services:
  db:
    image: mysql:8.0
    container_name: mca-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mca
      MYSQL_USER: mca
      MYSQL_PASSWORD: ${DB_PASSWORD:-mca_secret_change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
    volumes:
      - mca_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: mca-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "MCA Patient Docs"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://${HOST:-localhost}:${APP_PORT:-8080}"
      APP_TIMEZONE: Asia/Manila
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mca
      DB_USERNAME: mca
      DB_PASSWORD: ${DB_PASSWORD:-mca_secret_change_me}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    volumes:
      - mca_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mca_storage:
  mca_db_data: