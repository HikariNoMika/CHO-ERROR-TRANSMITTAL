services:
  app:
    build: .
    container_name: mca-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "MCA Patient Docs"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://${HOST:-localhost}:${APP_PORT:-8080}"
      APP_TIMEZONE: Asia/Manila
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
    volumes:
      # Persist uploads, generated documents, templates and the sqlite DB
      - mca_storage:/var/www/html/storage
      - mca_database:/var/www/html/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mca_storage:
  mca_database: